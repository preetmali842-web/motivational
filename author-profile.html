<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Author Profile — Inspire</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark-mode">
  <header class="glass-nav">
    <div class="logo">Inspire</div>
    <nav class="nav-links">
      <a href="index.html">Quotes</a>
      <a href="authors.html">Authors</a>
    </nav>
  </header>

  <main class="container page-layout">
    <section id="profileHeader" class="glass-card profile-header">
      <img id="profileImg" class="profile-large-img" alt="Author image" />
      <div>
        <h1 id="profileName">Author Name</h1>
        <div class="meta-text" id="profileMeta">Profession • Country • 1860–1930</div>
        <div class="tags" id="profileTags"></div>
      </div>
    </section>

    <section class="profile-body">
      <div class="glass-card">
        <h3>Biography</h3>
        <p id="profileAbout"></p>

        <h4 class="mt-2">Career & Achievements</h4>
        <ul id="profileCareer" class="custom-list"></ul>

        <h4 class="mt-2">Famous Works</h4>
        <ul id="profileBooks" class="custom-list"></ul>
      </div>

      <div class="glass-card">
        <h3>Quotes by <span id="profileShortName"></span></h3>
        <div id="profileQuotes" class="quotes-list"></div>

        <h4 class="mt-2">Related Authors</h4>
        <div id="relatedAuthors" class="authors-grid"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { loadAuthorProfile } from './script.js';
    loadAuthorProfile();
  </script>
</body>
</html>
