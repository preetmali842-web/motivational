<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inspire — Daily Motivational Quotes</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/favicon.png" />
</head>
<body class="dark-mode">
  <header class="glass-nav">
    <div class="logo">Inspire</div>
    <nav class="nav-links">
      <a href="index.html" class="active">Quotes</a>
      <a href="authors.html">Authors</a>
      <a href="#" id="top100Link">Top 100</a>
    </nav>
    <div class="nav-actions">
      <button id="themeToggle" class="glass-btn" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
    </div>
  </header>

  <main class="container page-layout">
    <section id="quote-section" class="glass-card">
      <div class="card-header">
        <span id="quoteCategory" class="badge"></span>
        <div class="action-group">
          <button id="prevBtn" class="icon-btn" title="Previous"><i class="fas fa-chevron-left"></i></button>
          <button id="nextBtn" class="icon-btn" title="Next"><i class="fas fa-chevron-right"></i></button>
          <button id="shuffleBtn" class="icon-btn" title="Shuffle"><i class="fas fa-random"></i></button>
        </div>
      </div>

      <div class="quote-body">
        <div class="quote-text">
          <i class="quote-icon fas fa-quote-left"></i>
          <span id="quoteText">Loading quote…</span>
          <i class="quote-icon fas fa-quote-right"></i>
        </div>

        <div class="author-profile">
          <img id="authorImg" class="author-img hidden" alt="Author photo" />
          <div>
            <div id="authorName" class="author-name">—</div>
            <div id="authorProfession" class="meta-text">—</div>
            <p id="authorAbout" class="meta-text hidden"></p>
          </div>
        </div>

        <div class="progress-bar" aria-hidden="true">
          <div id="progressFill" class="progress-fill"></div>
        </div>

        <div class="card-actions">
          <div class="action-group">
            <button id="copyBtn" class="glass-btn">Copy</button>
            <button id="shareBtn" class="glass-btn">Share</button>
            <button id="downloadBtn" class="glass-btn">Download</button>
          </div>
          <div class="action-group">
            <button id="favBtn" class="icon-btn" title="Favorite"><i class="far fa-heart"></i></button>
            <button id="dailyBtn" class="glass-btn">Daily</button>
          </div>
        </div>
      </div>
    </section>

    <section class="extras">
      <div class="glass-card search-container">
        <input id="globalSearch" class="glass-input full-width" placeholder="Search quotes, authors, categories..." />
      </div>

      <div class="glass-card mt-2">
        <h3>Quick Actions</h3>
        <div class="action-grid">
          <button id="infiniteShuffle" class="glass-btn">Infinite Shuffle</button>
          <button id="top100Btn" class="glass-btn">Top 100</button>
          <button id="categoriesBtn" class="glass-btn">Categories</button>
        </div>
      </div>
    </section>
  </main>

  <div id="bgOverlay" class="background-overlay bg-fixed"></div>

  <script src="https://kit.fontawesome.com/a2d9b6b6f6.js" crossorigin="anonymous"></script>
  <script src="script.js" type="module"></script>
</body>
</html>
