<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InspireFlow — Premium Motivational Quotes</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --glass-blur: blur(20px);
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            --bg-overlay: rgba(255, 255, 255, 0.3);
            --text-primary: #1a1a2e;
            --text-secondary: #333;
            --card-bg: rgba(255, 255, 255, 0.35);
            --card-hover: rgba(255, 255, 255, 0.5);
            --accent: #6c5ce7;
            --accent2: #e056a0;
            --btn-bg: rgba(255, 255, 255, 0.3);
            --btn-hover: rgba(255, 255, 255, 0.55);
            --input-bg: rgba(255, 255, 255, 0.4);
            --modal-bg: rgba(0, 0, 0, 0.5);
            --tag-bg: rgba(108, 92, 231, 0.2);
            --tag-text: #4a3db5;
            --star-color: #f9a825;
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
        }
        [data-theme="dark"] {
            --glass-bg: rgba(20, 20, 40, 0.55);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 40%, #24243e 100%);
            --bg-overlay: rgba(0, 0, 0, 0.4);
            --text-primary: #e8e8f0;
            --text-secondary: #c0c0d0;
            --card-bg: rgba(30, 30, 55, 0.6);
            --card-hover: rgba(40, 40, 70, 0.75);
            --accent: #a78bfa;
            --accent2: #f472b6;
            --btn-bg: rgba(255, 255, 255, 0.08);
            --btn-hover: rgba(255, 255, 255, 0.18);
            --input-bg: rgba(30, 30, 55, 0.6);
            --modal-bg: rgba(0, 0, 0, 0.7);
            --tag-bg: rgba(167, 139, 250, 0.2);
            --tag-text: #c4b5fd;
            --star-color: #fbbf24;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: bgShift 20s ease infinite;
            color: var(--text-primary);
            transition: all 0.5s ease;
            position: relative;
            overflow-x: hidden;
        }
        @keyframes bgShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: var(--bg-overlay);
            z-index: -1;
            pointer-events: none;
        }
        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(110vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }
        /* Navigation */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            transition: all 0.4s ease;
        }
        .logo {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            cursor: pointer;
        }
        .nav-links {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            list-style: none;
        }
        .nav-links button {
            background: var(--btn-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0.55rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        .nav-links button:hover,
        .nav-links button.active {
            background: var(--btn-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.3);
        }
        .theme-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: var(--btn-bg);
            cursor: pointer;
            font-size: 1.3rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .theme-toggle:hover {
            background: var(--btn-hover);
            transform: rotate(20deg);
        }
        /* Main container */
        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.5rem;
            position: relative;
            z-index: 1;
        }
        /* Section visibility */
        .section {
            display: none;
            animation: fadeSlideIn 0.5s ease;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Glass card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
        }
        .glass-card:hover {
            background: var(--card-hover);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18);
            transform: translateY(-3px);
        }
        /* Quote display */
        .quote-main {
            text-align: center;
            padding: 3rem 2rem;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .quote-main::before {
            content: '"';
            position: absolute;
            top: -30px;
            left: 20px;
            font-size: 12rem;
            opacity: 0.06;
            font-family: Georgia, serif;
            pointer-events: none;
        }
        .quote-text {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 1.2rem;
            letter-spacing: -0.3px;
            position: relative;
            z-index: 1;
        }
        .quote-author-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .author-photo {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.35);
            transition: var(--transition);
        }
        .author-photo:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.5);
        }
        .author-info {
            text-align: left;
        }
        .author-name {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .author-profession {
            font-size: 0.9rem;
            opacity: 0.75;
        }
        .category-badge {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 0.35rem 1rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.5rem;
            letter-spacing: 0.5px;
        }
        .about-author {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }
        /* Buttons row */
        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
        .btn {
            background: var(--btn-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0.6rem 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }
        .btn:hover {
            background: var(--btn-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        }
        .btn.accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 700;
        }
        .btn.accent:hover {
            background: var(--accent2);
            border-color: var(--accent2);
        }
        .btn .icon {
            font-size: 1.1rem;
        }
        /* Timer indicator */
        .timer-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-top: 1.5rem;
            overflow: hidden;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .timer-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 1s linear;
            width: 100%;
        }
        /* Authors grid */
        .authors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .author-card {
            text-align: center;
            cursor: pointer;
            padding: 1.8rem 1.5rem;
        }
        .author-card .author-photo-lg {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent);
            margin-bottom: 1rem;
            transition: var(--transition);
        }
        .author-card:hover .author-photo-lg {
            transform: scale(1.08);
            box-shadow: 0 12px 30px rgba(108, 92, 231, 0.45);
        }
        .author-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }
        .author-card .meta {
            font-size: 0.85rem;
            opacity: 0.7;
        }
        /* Search bar */
        .search-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 2rem;
            align-items: center;
        }
        .search-input {
            flex: 1;
            min-width: 220px;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            backdrop-filter: blur(10px);
            transition: var(--transition);
            outline: none;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15);
        }
        .search-select {
            padding: 0.75rem 1.2rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            cursor: pointer;
            outline: none;
            transition: var(--transition);
        }
        .search-select:focus {
            border-color: var(--accent);
        }
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--modal-bg);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.hidden {
            display: none;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
            animation: scaleIn 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
        }
        @keyframes scaleIn {
            from {
                transform: scale(0.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-close {
            float: right;
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-primary);
            transition: var(--transition);
            line-height: 1;
        }
        .modal-close:hover {
            transform: rotate(90deg);
            color: var(--accent2);
        }
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            z-index: 300;
            font-weight: 600;
            box-shadow: var(--glass-shadow);
            animation: toastIn 0.4s ease, toastOut 0.4s ease 2s forwards;
            pointer-events: none;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
        }
        /* Reading progress */
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: var(--accent2);
            z-index: 250;
            transition: width 0.15s ease;
            border-radius: 0 2px 2px 0;
        }
        /* Responsive */
        @media (max-width: 768px) {
            .quote-text {
                font-size: 1.5rem;
            }
            .navbar {
                padding: 0.6rem 1rem;
                gap: 0.4rem;
            }
            .nav-links button {
                padding: 0.4rem 0.8rem;
                font-size: 0.75rem;
            }
            .logo {
                font-size: 1.3rem;
            }
            .authors-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }
            .glass-card {
                padding: 1.2rem;
            }
            .quote-main {
                padding: 2rem 1rem;
            }
            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.78rem;
            }
        }
        @media (max-width: 480px) {
            .quote-text {
                font-size: 1.2rem;
            }
            .author-photo {
                width: 48px;
                height: 48px;
            }
            .btn-row {
                gap: 0.4rem;
            }
            .btn {
                padding: 0.4rem 0.75rem;
                font-size: 0.7rem;
            }
        }
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
        /* Favorites heart animation */
        .heart-beat {
            animation: heartBeat 0.6s ease;
        }
        @keyframes heartBeat {
            0%,
            100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.3);
            }
            50% {
                transform: scale(0.9);
            }
            75% {
                transform: scale(1.2);
            }
        }
        .quote-of-day-banner {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            text-align: center;
            padding: 0.6rem;
            border-radius: 16px;
            margin-bottom: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            animation: glowPulse 2s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
            }
            50% {
                box-shadow: 0 0 35px rgba(240, 147, 251, 0.5);
            }
        }
    </style>
</head>
<body>
    <!-- Reading Progress -->
    <div class="reading-progress" id="readingProgress"></div>
    <!-- Particles -->
    <div class="particles" id="particlesContainer"></div>
    <!-- Toast -->
    <div class="toast" id="toast" style="display:none;"></div>
    <!-- Navbar -->
    <nav class="navbar">
        <span class="logo" onclick="navigateTo('home')">✨ InspireFlow</span>
        <ul class="nav-links">
            <li><button class="active" data-nav="home" onclick="navigateTo('home')">🏠 Home</button></li>
            <li><button data-nav="authors" onclick="navigateTo('authors')">👤 Authors</button></li>
            <li><button data-nav="categories" onclick="navigateTo('categories')">📂 Categories</button></li>
            <li><button data-nav="favorites" onclick="navigateTo('favorites')">⭐ Favorites</button></li>
            <li><button data-nav="top100" onclick="navigateTo('top100')">🏆 Top 100</button></li>
        </ul>
        <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">🌓</button>
    </nav>
    <!-- Main Container -->
    <div class="main-container">
        <!-- HOME SECTION -->
        <section class="section active" id="section-home">
            <div class="quote-of-day-banner" id="qodBanner">🌟 Quote of the Day</div>
            <div class="glass-card quote-main" id="quoteCard">
                <p class="quote-text" id="quoteText">Loading...</p>
                <div class="quote-author-row">
                    <img class="author-photo" id="authorPhoto" src="https://ui-avatars.com/api/?name=Author&size=130&background=6c5ce7&color=fff&bold=true" alt="Author" onerror="this.src='https://ui-avatars.com/api/?name=Author&size=130&background=6c5ce7&color=fff&bold=true'">
                    <div class="author-info">
                        <span class="author-name" id="authorName">Author</span>
                        <br><span class="author-profession" id="authorProfession">Profession</span>
                    </div>
                </div>
                <span class="category-badge" id="categoryBadge">Category</span>
                <p class="about-author" id="aboutAuthor">About the author...</p>
                <div class="btn-row">
                    <button class="btn" onclick="prevQuote()" title="Previous Quote">⏮ Prev</button>
                    <button class="btn accent" onclick="randomQuote()" title="New Random Quote">🎲 Random</button>
                    <button class="btn" onclick="nextQuote()" title="Next Quote">Next ⏭</button>
                    <button class="btn" onclick="copyQuote()" title="Copy Quote">📋 Copy</button>
                    <button class="btn" onclick="shareQuote()" title="Share Quote">📤 Share</button>
                    <button class="btn" id="favBtn" onclick="toggleFavorite()" title="Favorite">🤍 Fav</button>
                    <button class="btn" onclick="downloadQuoteImage()" title="Download as Image">📸 Download</button>
                </div>
                <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
                <div class="btn-row" style="margin-top:0.8rem;">
                    <button class="btn" onclick="toggleShuffle()" id="shuffleBtn">🔀 Shuffle: OFF</button>
                    <button class="btn" onclick="showHistory()">📜 History</button>
                </div>
            </div>
            <!-- Trending quotes mini -->
            <div style="margin-top:1.5rem;">
                <h3 style="margin-bottom:0.8rem;">🔥 Trending Now</h3>
                <div style="display:flex;flex-wrap:wrap;gap:0.8rem;" id="trendingRow"></div>
            </div>
        </section>
        <!-- AUTHORS SECTION -->
        <section class="section" id="section-authors">
            <h2 style="margin-bottom:1rem;">📚 Authors Library</h2>
            <div class="search-container">
                <input class="search-input" id="authorSearch" placeholder="Search authors by name, country, profession..." oninput="renderAuthors()">
                <select class="search-select" id="authorCountryFilter" onchange="renderAuthors()">
                    <option value="">🌍 All Countries</option>
                </select>
                <select class="search-select" id="authorProfessionFilter" onchange="renderAuthors()">
                    <option value="">💼 All Professions</option>
                </select>
            </div>
            <div class="authors-grid" id="authorsGrid"></div>
        </section>
        <!-- CATEGORIES SECTION -->
        <section class="section" id="section-categories">
            <h2 style="margin-bottom:1rem;">📂 Categories</h2>
            <div class="search-container">
                <input class="search-input" id="categorySearch" placeholder="Search categories..." oninput="renderCategories()">
            </div>
            <div class="authors-grid" id="categoriesGrid"></div>
            <div id="categoryQuotesContainer" style="margin-top:1.5rem;"></div>
        </section>
        <!-- FAVORITES SECTION -->
        <section class="section" id="section-favorites">
            <h2 style="margin-bottom:1rem;">⭐ Your Favorites</h2>
            <div id="favoritesContainer"></div>
        </section>
        <!-- TOP 100 SECTION -->
        <section class="section" id="section-top100">
            <h2 style="margin-bottom:1rem;">🏆 Top 100 Quotes</h2>
            <div id="top100Container"></div>
        </section>
    </div>
    <!-- Author Profile Modal -->
    <div class="modal-overlay hidden" id="authorModal">
        <div class="modal-content" id="authorModalContent"></div>
    </div>
    <!-- History Modal -->
    <div class="modal-overlay hidden" id="historyModal">
        <div class="modal-content" id="historyModalContent"></div>
    </div>

    <script>
        // ==================== DATA ENGINE ====================
        // Core quote templates for generating 10,000+ quotes
        const quoteTemplates = [
            { t: "The only way to do great work is to love what you do.", a: "Steve Jobs", c: "Passion",

                'categories': 'section-categories',
                'favorites': 'section-favorites',
                'top100': 'section-top100'
            };
            const targetSection = document.getElementById(sectionMap[section] || 'section-home');
            if (targetSection) targetSection.classList.add('active');
            const navBtn = document.querySelector(`[data-nav="${section}"]`);
            if (navBtn) navBtn.classList.add('active');

            if (section === 'categories') renderCategories();

                startAutoChange();

                stopAutoChange();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

                if (quoteHistory.length > 200) quoteHistory.shift();

            // Reset timer
            resetTimer();
            // Update trending
            updateTrending();

            const btn = document.getElementById('favBtn');

                setTimeout(() => btn.classList.remove('heart-beat'), 600);

                btn.innerHTML = '🤍 Fav';

            } else {
                favorites.push(q.id);
                showToast('❤️ Added to favorites!');
            }
            saveFavorites();
            updateFavButton(q.id);
            if (currentSection === 'favorites') renderFavorites();

            const text = `"${q.quote}" — ${q.author}`;
            navigator.clipboard.writeText(text).then(() => showToast('📋 Copied to clipboard!'));
        }

        function shareQuote() {
            const q = allQuotes[currentQuoteIndex];
            const text = `"${q.quote}" — ${q.author}`;
            if (navigator.share) {
                navigator.share({ title: 'Inspirational Quote', text: text, url: window.location.href });
            } else {
                navigator.clipboard.writeText(text).then(() => showToast('📤 Quote copied for sharing!'));
            }
        }

        function downloadQuoteImage() {
            const q = allQuotes[currentQuoteIndex];
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 500;
            const ctx = canvas.getContext('2d');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const bgGrad = ctx.createLinearGradient(0, 0, 800, 500);
            bgGrad.addColorStop(0, isDark ? '#1a1a3e' : '#667eea');
            bgGrad.addColorStop(1, isDark ? '#0f0c29' : '#f093fb');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 800, 500);
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillRect(20, 20, 760, 460);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 32px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            wrapText(ctx, '"' + q.quote + '"', 400, 180, 700, 42);
            ctx.font = '22px "Segoe UI", sans-serif';
            ctx.fillText('— ' + q.author, 400, 340);
            ctx.font = '16px "Segoe UI", sans-serif';
            ctx.fillText(q.category + ' | InspireFlow', 400, 400);
            const link = document.createElement('a');
            link.download = `quote-${q.id}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('📸 Image downloaded!');
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    ctx.fillText(line.trim(), x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line.trim(), x, currentY);
        }

        // ==================== AUTO CHANGE TIMER ====================
        function startAutoChange() {
            stopAutoChange();
            resetTimer();
            autoChangeInterval = setInterval(() => {
                if (isShuffleMode) {
                    randomQuote();
                } else {
                    nextQuote();
                }
            }, 30000);
        }

        function stopAutoChange() {
            if (autoChangeInterval) clearInterval(autoChangeInterval);
            autoChangeInterval = null;
        }

        function resetTimer() {
            const fill = document.getElementById('timerFill');
            if (fill) {
                fill.style.transition = 'none';
                fill.style.width = '0%';
                requestAnimationFrame(() => {
                    fill.style.transition = 'width 30s linear';
                    fill.style.width = '100%';
                });
            }
        }

        function toggleShuffle() {
            isShuffleMode = !isShuffleMode;
            const btn = document.getElementById('shuffleBtn');
            btn.textContent = isShuffleMode ? '🔀 Shuffle: ON' : '🔀 Shuffle: OFF';
            if (isShuffleMode) btn.classList.add('accent');
            else btn.classList.remove('accent');
            showToast(isShuffleMode ? '🔀 Infinite shuffle activated!' : '🔄 Sequential mode');
        }

        // ==================== TRENDING ====================
        function updateTrending() {
            const row = document.getElementById('trendingRow');
            if (!row) return;
            const trending = allQuotes.slice(0, 8).map(q => ({
                ...q,
                score: Math.floor(Math.random() * 5000) + 100
            })).sort(() => Math.random() - 0.5);
            row.innerHTML = trending.map(q => `
            <div class="glass-card" style="padding:1rem;flex:1;min-width:180px;cursor:pointer;text-align:center;" onclick="displayQuote(${q.id-1})">
              <p style="font-weight:600;font-size:0.9rem;">"${q.quote.substring(0,60)}..."</p>
              <small style="opacity:0.7;">— ${q.author}</small>
              <br><span class="category-badge" style="font-size:0.7rem;">${q.category}</span>
            </div>
          `).join('');
        }

        // ==================== AUTHORS RENDERING ====================
        function renderAuthors() {
            const grid = document.getElementById('authorsGrid');
            const searchTerm = (document.getElementById('authorSearch')?.value || '').toLowerCase();
            const countryFilter = document.getElementById('authorCountryFilter')?.value || '';
            const professionFilter = document.getElementById('authorProfessionFilter')?.value || '';
            // Populate filters
            const countries = [...new Set(Object.values(authorsDB).map(a => a.country))].sort();
            const professions = [...new Set(Object.values(authorsDB).map(a => a.profession))].sort();
            const countrySel = document.getElementById('authorCountryFilter');
            const profSel = document.getElementById('authorProfessionFilter');
            if (countrySel && countrySel.options.length <= 1) {
                countries.forEach(c => { const o = document.createElement('option');
                    o.value = c;
                    o.textContent = c;
                    countrySel.appendChild(o); });
            }
            if (profSel && profSel.options.length <= 1) {
                professions.forEach(p => { const o = document.createElement('option');
                    o.value = p;
                    o.textContent = p;
                    profSel.appendChild(o); });
            }
            let filtered = Object.values(authorsDB).filter(a => {
                const matchSearch = !searchTerm || a.name.toLowerCase().includes(searchTerm) || a.country
                    .toLowerCase().includes(searchTerm) || a.profession.toLowerCase().includes(searchTerm);
                const matchCountry = !countryFilter || a.country === countryFilter;
                const matchProf = !professionFilter || a.profession === professionFilter;
                return matchSearch && matchCountry && matchProf;
            });
            if (filtered.length === 0) filtered = Object.values(authorsDB);
            grid.innerHTML = filtered.map(a => `
            <div class="glass-card author-card" onclick="openAuthorProfile('${a.name.replace(/'/g, "\\'")}')">
              <img class="author-photo-lg" src="${a.photo}" alt="${a.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(a.name)}&size=200&background=6c5ce7&color=fff&bold=true'">
              <h3>${a.name}</h3>
              <p class="meta">${a.profession}</p>
              <p class="meta">${a.country} • ${a.born}${a.died ? ' – ' + a.died : ''}</p>
              <p class="meta">📝 ${a.quotes.length} quotes</p>
            </div>
          `).join('');
        }

        function openAuthorProfile(authorName) {
            const author = authorsDB[authorName];
            if (!author) return;
            const relatedAuthors = Object.values(authorsDB).filter(a => a.id !== author.id && (a.profession === author
                .profession || a.country === author.country)).slice(0, 4);
            const modal = document.getElementById('authorModal');
            const content = document.getElementById('authorModalContent');
            content.innerHTML = `
            <button class="modal-close" onclick="closeAuthorModal()">✕</button>
            <div style="text-align:center;">
              <img src="${author.photo}" style="width:140px;height:140px;border-radius:50%;object-fit:cover;border:5px solid var(--accent);margin-bottom:1rem;" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(author.name)}&size=280&background=6c5ce7&color=fff&bold=true'">
              <h2>${author.name}</h2>
              <p style="opacity:0.8;">${author.profession} | ${author.country}</p>
              <p style="opacity:0.7;">${author.born}${author.died ? ' – ' + author.died : ' – Present'}</p>
            </div>
            <h4 style="margin-top:1.5rem;">📖 Biography</h4>
            <p style="line-height:1.7;">${author.about}</p>
            <h4 style="margin-top:1rem;">🏆 Achievements & Facts</h4>
            <ul>${(author.facts||[]).map(f=>`<li>${f}</li>`).join('')}</ul>
            <h4 style="margin-top:1rem;">📚 Famous Works</h4>
            <ul>${(author.books||[]).map(b=>`<li>${b}</li>`).join('')}</ul>
            <h4 style="margin-top:1rem;">💬 Complete Quote Collection (${author.quotes.length})</h4>
            <div style="max-height:250px;overflow-y:auto;">
              ${author.quotes.map((q,i)=>`<p style="padding:0.5rem;border-bottom:1px solid var(--glass-border);">${i+1}. "${q}"</p>`).join('')}
            </div>
            ${relatedAuthors.length ? `
            <h4 style="margin-top:1rem;">🔗 Related Authors</h4>
            <div style="display:flex;gap:0.8rem;flex-wrap:wrap;">
              ${relatedAuthors.map(ra=>`
                <span class="glass-card" style="padding:0.5rem 1rem;cursor:pointer;border-radius:50px;" onclick="closeAuthorModal();setTimeout(()=>openAuthorProfile('${ra.name.replace(/'/g,"\\'")}'),400)">${ra.name}</span>
              `).join('')}
            </div>`:''}
          `;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeAuthorModal() {
            document.getElementById('authorModal').classList.add('hidden');
            document.body.style.overflow = '';
        }
        document.getElementById('authorModal').addEventListener('click', function(e) {
            if (e.target === this) closeAuthorModal();
        });

        // ==================== CATEGORIES ====================
        function renderCategories() {
            const grid = document.getElementById('categoriesGrid');
            const searchTerm = (document.getElementById('categorySearch')?.value || '').toLowerCase();
            const catCounts = {};
            allQuotes.forEach(q => { catCounts[q.category] = (catCounts[q.category] || 0) + 1; });
            let cats = Object.entries(catCounts).map(([name, count]) => ({ name, count }));
            if (searchTerm) cats = cats.filter(c => c.name.toLowerCase().includes(searchTerm));
            grid.innerHTML = cats.map(c => `
            <div class="glass-card author-card" onclick="showCategoryQuotes('${c.name.replace(/'/g,"\\'")}')">
              <h3>📂 ${c.name}</h3>
              <p>${c.count} quotes</p>
            </div>
          `).join('');
        }

        function showCategoryQuotes(catName) {
            const container = document.getElementById('categoryQuotesContainer');
            const quotes = allQuotes.filter(q => q.category === catName).slice(0, 30);
            container.innerHTML = `
            <h3>Quotes in "${catName}"</h3>
            <div style="display:flex;flex-direction:column;gap:0.6rem;margin-top:1rem;">
              ${quotes.map(q=>`
                <div class="glass-card" style="padding:1rem;cursor:pointer;" onclick="displayQuote(${q.id-1});navigateTo('home')">
                  <p>"${q.quote}"</p>
                  <small>— ${q.author}</small>
                </div>
              `).join('')}
            </div>
          `;
            container.scrollIntoView({ behavior: 'smooth' });
        }

        // ==================== FAVORITES ====================
        function renderFavorites() {
            const container = document.getElementById('favoritesContainer');
            const favQuotes = allQuotes.filter(q => favorites.includes(q.id));
            if (favQuotes.length === 0) {
                container.innerHTML =
                    '<p style="text-align:center;padding:3rem;">No favorites yet. ❤️ some quotes from the Home section!</p>';
                return;
            }
            container.innerHTML = favQuotes.map(q => `
            <div class="glass-card" style="padding:1.2rem;margin-bottom:0.8rem;cursor:pointer;" onclick="displayQuote(${q.id-1});navigateTo('home')">
              <p style="font-weight:600;">"${q.quote}"</p>
              <small>— ${q.author} | ${q.category}</small>
              <button class="btn" style="float:right;margin-top:-0.5rem;" onclick="event.stopPropagation();removeFavorite(${q.id})">🗑 Remove</button>
            </div>
          `).join('');
        }

        function removeFavorite(quoteId) {
            favorites = favorites.filter(f => f !== quoteId);
            saveFavorites();
            renderFavorites();
            updateFavButton(allQuotes[currentQuoteIndex]?.id);
            showToast('🗑 Removed from favorites');
        }

        // ==================== TOP 100 ====================
        function renderTop100() {
            const container = document.getElementById('top100Container');
            const topQuotes = [...allQuotes].sort(() => Math.random() - 0.5).slice(0, 100);
            container.innerHTML = topQuotes.map((q, i) => `
            <div class="glass-card" style="padding:1rem;margin-bottom:0.6rem;cursor:pointer;display:flex;gap:1rem;align-items:center;" onclick="displayQuote(${q.id-1});navigateTo('home')">
              <span style="font-size:1.5rem;font-weight:800;opacity:0.5;min-width:40px;">#${i+1}</span>
              <div>
                <p>"${q.quote}"</p>
                <small>— ${q.author} | ${q.category}</small>
              </div>
            </div>
          `).join('');
        }

        // ==================== HISTORY ====================
        function showHistory() {
            const modal = document.getElementById('historyModal');
            const content = document.getElementById('historyModalContent');
            content.innerHTML = `
            <button class="modal-close" onclick="closeHistoryModal()">✕</button>
            <h3>📜 Quote History</h3>
            <div style="max-height:60vh;overflow-y:auto;margin-top:1rem;">
              ${quoteHistory.slice().reverse().map(h=>`
                <div class="glass-card" style="padding:0.8rem;margin-bottom:0.5rem;cursor:pointer;" onclick="displayQuote(${h.id-1});closeHistoryModal();navigateTo('home')">
                  <p>"${h.quote.substring(0,80)}..."</p>
                  <small>— ${h.author} | ${new Date(h.timestamp).toLocaleTimeString()}</small>
                </div>
              `).join('')}
              ${quoteHistory.length===0?'<p>No history yet.</p>':''}
            </div>
          `;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.add('hidden');
            document.body.style.overflow = '';
        }
        document.getElementById('historyModal').addEventListener('click', function(e) {
            if (e.target === this) closeHistoryModal();
        });

        // ==================== TOAST ====================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            toast.style.animation = 'none';
            toast.offsetHeight;
            toast.style.animation = 'toastIn 0.4s ease, toastOut 0.4s ease 2s forwards';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        // ==================== THEME TOGGLE ====================
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('inspireflow_theme', newTheme);
            document.getElementById('themeToggle').textContent = newTheme === 'dark' ? '☀️' : '🌓';
        }
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        // Load saved theme
        const savedTheme = localStorage.getItem('inspireflow_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeToggle').textContent = savedTheme === 'dark' ? '☀️' : '🌓';

        // ==================== PARTICLES ====================
        function createParticles() {
            const container = document.getElementById('particlesContainer');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 8 + 3;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 15 + 10 + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(particle);
            }
        }
        createParticles();

        // ==================== READING PROGRESS ====================
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
            document.getElementById('readingProgress').style.width = Math.min(progress, 100) + '%';
        });

        // ==================== KEYBOARD NAVIGATION ====================
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName ===
                'TEXTAREA') return;
            if (currentSection === 'home') {
                if (e.key === 'ArrowRight') nextQuote();
                if (e.key === 'ArrowLeft') prevQuote();
                if (e.key === ' ') { e.preventDefault();
                    randomQuote(); }
                if (e.key === 'f') toggleFavorite();
                if (e.key === 'c') copyQuote();
            }
            if (e.key === 'Escape') { closeAuthorModal();
                closeHistoryModal(); }
        });

        // ==================== INITIALIZATION ====================
        function init() {
            currentQuoteIndex = Math.floor(Math.random() * allQuotes.length);
            displayQuote(currentQuoteIndex);
            startAutoChange();
            updateTrending();
            // Set quote of the day
            const qod = allQuotes[Math.floor(Math.random() * allQuotes.length)];
            document.getElementById('qodBanner').textContent =
                `🌟 Quote of the Day: "${qod.quote.substring(0,50)}..." — ${qod.author}`;
        }
        init();

        // ==================== SERVICE WORKER FOR OFFLINE SUPPORT ====================
        if ('serviceWorker' in navigator) {
            // Basic offline caching via service worker registration
            // In production, this would cache assets for offline use
            const cacheName = 'inspireflow-v1';
            // We register a simple SW inline via blob (for demo purposes)
            const swCode = `
            const CACHE_NAME = '${cacheName}';
            self.addEventListener('install', e => { self.skipWaiting(); });
            self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
            self.addEventListener('fetch', e => {
              e.respondWith(
                fetch(e.request).catch(() => caches.match(e.request))
              );
            });
          `;
            try {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob), { scope: '/' }).catch(() => {});
            } catch (e) {}
        }

        console.log('✨ InspireFlow — Premium Motivational Quotes Platform');
        console.log('📊 Total Quotes:', allQuotes.length);
        console.log('👤 Total Authors:', Object.keys(authorsDB).length);
        console.log('💾 Favorites saved in LocalStorage');
        console.log('🎨 Glassmorphism UI | 🌓 Dark/Light Mode | ⌨️ Keyboard Navigation');
        console.log('🔄 Auto-change: 30s | 🔀 Shuffle Mode | 📸 Download as Image');
        console.log('📱 Fully Responsive | 🚀 Fast Loading | 💡 Offline Support');
    </script>
</body>
</html>
