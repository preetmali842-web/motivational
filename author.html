<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Authors — Inspire</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark-mode">
  <header class="glass-nav">
    <div class="logo">Inspire</div>
    <nav class="nav-links">
      <a href="index.html">Quotes</a>
      <a href="authors.html" class="active">Authors</a>
    </nav>
    <div class="nav-actions">
      <button id="themeToggleAuthors" class="glass-btn"><i class="fas fa-moon"></i></button>
    </div>
  </header>

  <main class="container page-layout">
    <section class="glass-card search-container">
      <input id="authorSearch" class="glass-input full-width" placeholder="Search by name, country, profession, category..." />
    </section>

    <section id="authorsGrid" class="authors-grid"></section>
  </main>

  <script src="https://kit.fontawesome.com/a2d9b6b6f6.js" crossorigin="anonymous"></script>
  <script type="module">
    import { loadAuthorsPage } from './script.js';
    loadAuthorsPage();
    document.getElementById('themeToggleAuthors').addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    });
  </script>
</body>
</html>
